[hooks]
# SKIP_E2E=1 keeps the e2e target out of the commit gate (it spawns the built
# binary and can park on a display-less host); the full suite still runs via
# ./scripts/check.sh without the flag. See scripts/check.sh.
pre-commit = "SKIP_E2E=1 ./scripts/check.sh && ./cargo.sh fmt && git add -u . && ./cargo.sh fmt --check"

[logging]
verbose = true
