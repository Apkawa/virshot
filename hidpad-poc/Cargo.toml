[package]
name = "hidpad-poc"
version = "0.1.0"
edition = "2024"

# Standalone workspace root: the repo root gained a `[workspace]` (overlay/toast
# task), and cargo rejects a subdirectory package invoked from its own directory
# ("current package believes it's in a workspace when it's not") unless it
# declares its own workspace. The empty table makes hidpad-poc its own workspace
# root; the root manifest excludes it.

[workspace]


# No dependencies: the GameInput mode is a hand-written COM vtable shim over the
# `gameinput.dll` exports (`LoadLibraryW` / `GetProcAddress` from the Windows
# ABI), and the layout tests are std-only. `vendor/GameInput.h` is the ABI
# authority; see `vendor/NOTICE.md` for its provenance.
