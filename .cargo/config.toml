#[target.x86_64-pc-windows-gnu]
#linker = "x86_64-w64-mingw32-gcc"
# MinGW linker flag: PE subsystem 2 (WINDOWS_GUI) instead of the rustc
# default console subsystem, so launching virshot.exe opens no black console.
# MUST be use `#![windows_subsystem = "windows"]`
#rustflags = ["-C", "link-args=-Wl,--subsystem,windows"]
