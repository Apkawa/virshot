_version: 2

# Single rust-i18n catalog (spec §2): all localized texts in one file,
# `_version: 2` — every dotted key carries its locale blocks below it.
# `en` holds the exact English wording the source uses today (byte-for-byte);
# `ru` lands in Stage 3, zh-CN/es/ja/ko in Stage 4. `%{name}` placeholders are
# interpolated by `rust_i18n::t!(key, name = value)`.

