<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- VIRShot app icon: camera glyph, 4x scale of the 32-unit procedural
       tray glyph in src/tray.rs. Palette matches tray.rs: body #505050,
       lens ring #c8c8c8, lens core #181818. No background rect: the
       corners stay transparent so the rasterized PNG keeps alpha. -->
  <!-- Viewfinder bump (top-left), drawn before the body so the body edge
       overlaps its bottom half, like the tray glyph. -->
  <rect x="32" y="16" width="56" height="28" rx="6" fill="#505050"/>
  <!-- Camera body. -->
  <rect x="12" y="32" width="104" height="88" rx="10" fill="#505050"/>
  <!-- Lens: light ring with a dark core, centered inside the body. -->
  <circle cx="66" cy="64" r="26" fill="#c8c8c8"/>
  <circle cx="66" cy="64" r="14" fill="#181818"/>
</svg>
