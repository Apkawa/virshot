name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux x86_64 — fmt / check / test / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dev packages (xcap / eframe GL chain)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libegl1-mesa-dev libgbm-dev libudev-dev \
            libwayland-dev libpipewire-0.3-dev libclang-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  windows:
    name: Windows — test / clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run workspace tests
        run: cargo test --workspace -- --skip 'cli_headless::'
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  release:
    name: Release trigger
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh workflow run release.yaml \
            --ref ${{ github.ref_name }} \
            --field tag=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
