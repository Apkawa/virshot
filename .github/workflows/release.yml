name: Release

on:
  workflow_run:
      workflows: ['CI']
      types: [completed]

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The runner only exposes GITHUB_TOKEN as a secret; `gh` needs it in the
  # environment to publish releases with this workflow's `contents: write`.
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: virshot.exe
            key: win-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: virshot
            key: linux-x64
    steps:
      - uses: actions/checkout@v4
      - name: Install native dev packages (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libegl1-mesa-dev libgbm-dev libudev-dev \
            libwayland-dev libpipewire-0.3-dev libclang-dev
      - name: Add build target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.key }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 5

  package:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    name: Package and publish
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: binary-win-x64
          path: binaries/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: binary-linux-x64
          path: binaries/linux-x64
      - name: Resolve build kind and tag
        id: kind
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "kind=nightly" >> "$GITHUB_OUTPUT"
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
          fi
      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install git-cliff
        run: cargo install git-cliff --version 2.14.2 --no-default-features
      - name: Generate release notes
        run: |
          mkdir -p dist
          if [ "${{ steps.kind.outputs.kind }}" = "release" ]; then
            git-cliff --latest -o dist/notes.md
          else
            git-cliff --unreleased -o dist/notes.md
          fi
      - name: Package archives
        run: |
          ./scripts/package-release.sh \
            --binaries binaries \
            --version "${{ steps.version.outputs.version }}" \
            --kind "${{ steps.kind.outputs.kind }}" \
            --sha "$(git rev-parse --short HEAD)" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ steps.kind.outputs.tag }}" \
            --out dist
      - name: Publish release via gh
        run: |
          tag="${{ steps.kind.outputs.tag }}"
          kind="${{ steps.kind.outputs.kind }}"
          assets=(dist/*.zip dist/*.tar.gz dist/release.yaml)
          notes=(--notes "See release.yaml for artifacts, sha512 checksums and sizes.")
          if [ -f dist/notes.md ]; then
            notes=(--notes-file dist/notes.md)
          fi
          prerelease=()
          if [ "$kind" = "nightly" ]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$kind" = "nightly" ]; then
              gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
                [ -n "$asset" ] && gh release delete-asset "$tag" "$asset" --yes
              done
            fi
            gh release upload "$tag" "${assets[@]}"
            gh release edit "$tag" --target "$(git rev-parse HEAD)" "${notes[@]}"
          else
            gh release create "$tag" --target "$(git rev-parse HEAD)" \
              "${prerelease[@]}" "${notes[@]}" "${assets[@]}"
          fi
