[package]
name = "virshot"
version = "0.1.0"
edition = "2024"

# Workspace (overlay/toast plan Stage 1): the root package stays the shipped
# binary; `crates/overlay` (low-level overlay window library) and `crates/toast`
# (toast notifications on top of it) join as members. `crates/gamepad` and
# `hidpad-poc` are explicitly `exclude`d so they keep standing alone as before —
# the Windows-only GameInput shim and the historical PoC are never compiled by
# the Linux gate.
[workspace]
members = [".", "crates/overlay", "crates/toast", "crates/gamepad", "crates/icons"]
exclude = [ "hidpad-poc"]

[dependencies]
xcap = { version = "0.9.8", features = ["wgc"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
chrono = "0.4.45"
thiserror = "2"
# Feature-trimmed for the <10 MB exe budget (spec §5): eframe defaults pull
# wgpu + accesskit + clipboard/system_fonts/web_screen_reader, unused by the MVP
# UI. glow renderer only. x11/wayland are kept for the Linux dev host (winit
# compile-errors without a platform backend there); both are unix-only deps, so
# the shipped Windows exe is unaffected.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
egui = "0.37.0"
global-hotkey = "0.9.0"
# Native folder picker for the General tab Browse button (spec §4.4, approved
# by the user 2026-11-03). Default features (`xdg-portal` + `wayland`) are what
# the BLOCKING API needs: `pollster` (unix-only, pulled by `xdg-portal`) drives
# blocking-over-portal, Windows uses `windows-sys` common controls
# (`src/backend/win_cid.rs`), Linux the XDG portal with a zenity fallback. No
# async/tokio feature is enabled — verified in the locked 0.17.2 source.
rfd = "0.17.2"

# Overlay + toast (overlay/toast plan Stage 4): path deps on the workspace
# members `crates/overlay` (overlay windows — the host-loop backend paints toast
# chips as child egui viewports of the settings window's loop) and `crates/toast`
# (toast rules on a std timer thread, sink-driven backends). Both crates joined
# the workspace in Stage 1 and are already in `Cargo.lock`; declaring them here
# pulls no new crates.io entry — winit/glutin/egui/glow versions are the ones
# eframe already locks.
overlay = { path = "crates/overlay" }
toast = { path = "crates/toast" }

# Icon assets (icons plan Stage 1): path dep on the workspace member
# `crates/icons` — PNG icon bytes embedded via include_bytes! (tray/window app
# icon + warning toast chip). Cross-platform like overlay/toast; egui/image/
# thiserror versions are already locked in `Cargo.lock`, so no new crates.io
# entry is pulled. Assets are generated by scripts/gen-icons.sh in a later step.
icons = { path = "crates/icons" }
rust-i18n = "4.2.4"

# Gamepad trigger on Windows (plan Stage 4, docs/spec.md §4.1 pad field): path
# dep on `crates/gamepad` — the hand-written `gameinput.dll` COM shim extracted
# from `hidpad-poc/`, zero crates.io dependencies (the `windows` crate plan from
# AGENTS.md is superseded by the shim; no new external crate, so no approval
# was needed). Target-scoped because the crate's GameInput module is
# `#[cfg(windows)]`: on Linux the dependency is not pulled in at all, so
# `./scripts/check.sh` never compiles it. Linux gilrs stays out of scope
# (hardware finding: the wgi backend gates reads on the controller timestamp,
# generic HID pads report a constant one — presses never arrive; vendor=1118
# product=2835).
[target."cfg(windows)".dependencies]
gamepad = { path = "crates/gamepad" }

[dev-dependencies]
rusty-hook = "^0.11.2"

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
