[package]
name = "virshot"
version = "0.1.7"
edition = "2024"

# Workspace (overlay/toast plan Stage 1): the root package stays the shipped
# binary; `crates/overlay` (low-level overlay window library) and `crates/toast`
# (toast notifications on top of it) join as members. `crates/gamepad` and
# `hidpad-poc` are explicitly `exclude`d so they keep standing alone as before —
# the Windows-only GameInput shim and the historical PoC are never compiled by
# the Linux gate.
[workspace]
members = [".", "crates/overlay", "crates/toast", "crates/gamepad", "crates/icons", "crates/video-capture"]
exclude = [ "hidpad-poc"]

[dependencies]
xcap = { version = "0.9.8", features = ["wgc"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
chrono = "0.4.45"
thiserror = "2"
# Feature-trimmed for the < 12 MB exe budget (spec §5): eframe defaults pull
# wgpu + accesskit + clipboard/system_fonts/web_screen_reader, unused by the MVP
# UI. glow renderer only. x11/wayland are kept for the Linux dev host (winit
# compile-errors without a platform backend there); both are unix-only deps, so
# the shipped Windows exe is unaffected.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "links"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
egui = "0.37.0"
# Markdown rendering inside egui (approved by the user). Defaults are off:
# `load-images` would enable egui_extras image/file (image + mime_guess2),
# `regex` would pull fancy-regex, `better_syntax_highlighting` — syntect.
# egui_extras itself is an unconditional dep of egui_commonmark(+_backend),
# declared there with default-features=false; pulldown-cmark is transitive.
egui_commonmark = { version = "0.26.0", default-features = false }
global-hotkey = "0.9.0"
# Native folder picker for the General tab Browse button (spec §4.4, approved
# by the user 2026-11-03). Default features (`xdg-portal` + `wayland`) are what
# the BLOCKING API needs: `pollster` (unix-only, pulled by `xdg-portal`) drives
# blocking-over-portal, Windows uses `windows-sys` common controls
# (`src/backend/win_cid.rs`), Linux the XDG portal with a zenity fallback. No
# async/tokio feature is enabled — verified in the locked 0.17.2 source.
rfd = "0.17.2"

# Overlay + toast (overlay/toast plan Stage 4): path deps on the workspace
# members `crates/overlay` (overlay windows — the host-loop backend paints toast
# chips as child egui viewports of the settings window's loop) and `crates/toast`
# (toast rules on a std timer thread, sink-driven backends). Both crates joined
# the workspace in Stage 1 and are already in `Cargo.lock`; declaring them here
# pulls no new crates.io entry — winit/glutin/egui/glow versions are the ones
# eframe already locks.
overlay = { path = "crates/overlay" }
toast = { path = "crates/toast" }

# Icon assets (icons plan Stage 1): path dep on the workspace member
# `crates/icons` — PNG icon bytes embedded via include_bytes! (tray/window app
# icon + warning toast chip). Cross-platform like overlay/toast; egui/image/
# thiserror versions are already locked in `Cargo.lock`, so no new crates.io
# entry is pulled. Assets are generated by scripts/gen-icons.sh in a later step.
icons = { path = "crates/icons" }
rust-i18n = "4.2.4"
# Runtime half of shadow-rs (approved by the user): the ungated `shadow_rs::shadow!`
# macro includes the generated OUT_DIR/shadow.rs constants produced at build time, so
# the `build` feature stays OFF here (it lives in [build-dependencies] only) — no
# cargo_metadata/git2 in the runtime graph, no jiff.
shadow-rs = { version = "2.0.0", default-features = false }

# Automatic self-update (task 2026-11-11_auto-update, approved by the user).
# All feature-trimmed for the exe budget (docs/spec.md §5, revised to < 12 MB):
# ureq is blocking HTTP with rustls + bundled webpki roots (no OS cert store, no
# tokio/hyper, gzip OFF — archives are decompressed by flate2/zip below); sha2 is
# digest-only (oid/alloc OFF); zip reads one deflate entry (aes/bzip2/lzma/ppmd/
# zstd/xz/time OFF); flate2 is declared explicitly with the pure-Rust backend so
# feature unification enables miniz_oxide for zip's deflate copy (the old "rust"
# feature name no longer exists in 1.1.x); serde_json is already locked
# transitively via rust-i18n, declaring it adds no new package; self-replace does
# the in-place binary swap (its own cfg(windows) deps are already locked).
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
sha2 = { version = "0.11.1", default-features = false }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
serde_json = "1.0.154"
self-replace = "1.5.1"
# YAML parsing of release.yaml (Stage 3 amendment, approved by the user
# 2026-11-11): serde-saphyr is a DECLARATION of an already-locked transitive
# crate — rust-i18n pulls it in via rust-i18n-macro -> rust-i18n-support
# (`codegen` feature), so Cargo.lock gains only a serde-saphyr dependency edge
# on the virshot package: ZERO new packages, the same declared-precedent shape
# as flate2/serde_json above. The `deserialize` feature gates `from_str`; the
# crate's own default features stay enabled through feature unification with
# rust-i18n-support (rust-i18n-macro always enables codegen), so the feature
# graph is unchanged. The code was previously compiler-side only (the macro
# path), so only now — with `parse_manifest` referencing `from_str` — do the
# deserializer objects enter the shipped exe (measured 2026-11-11: +14,080 B on
# the linux release build, +22,016 B on the windows-gnu release build).
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }

# Gamepad trigger on Windows (plan Stage 4, docs/spec.md §4.1 pad field): path
# dep on `crates/gamepad` — the hand-written `gameinput.dll` COM shim extracted
# from `hidpad-poc/`, zero crates.io dependencies (the `windows` crate plan from
# AGENTS.md is superseded by the shim; no new external crate, so no approval
# was needed). Target-scoped because the crate's GameInput module is
# `#[cfg(windows)]`: on Linux the dependency is not pulled in at all, so
# `./scripts/check.sh` never compiles it. Linux gilrs stays out of scope
# (hardware finding: the wgi backend gates reads on the controller timestamp,
# generic HID pads report a constant one — presses never arrive; vendor=1118
# product=2835).
[target."cfg(windows)".dependencies]
gamepad = { path = "crates/gamepad" }
# Registry access for the HKCU Run autostart entry (task 2026-11-13_autostart,
# approved by the user): winreg is pure Rust (compiles under x86_64-pc-windows-gnu
# MinGW) and its 0.56.0 manifest declares NO default features — the optional
# `transactions` and `serialization-serde` are never used here, so a plain
# declaration is already feature-empty. Target-scoped like gamepad: on Linux
# the dependency is not pulled in at all.
winreg = "0.56"

# Build-script half of shadow-rs (approved by the user): the `build` feature is what
# makes `shadow_rs::ShadowBuilder::builder().build()` in build.rs generate the
# metadata constants (version, build time, git fields). Git data comes from the `git`
# CLI, NOT from git2 — the default `git2` feature stays off, so no libgit2-sys C build
# on any target (including the Windows-gnu cross-build). Feature flags are
# compile-time-only, so this section's `build` feature never leaks into the runtime
# dependency above.
[build-dependencies]
shadow-rs = { version = "2.0.0", default-features = false, features = ["build"] }
windows_exe_info = "0.5"

[dev-dependencies]
rusty-hook = "^0.11.2"

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
